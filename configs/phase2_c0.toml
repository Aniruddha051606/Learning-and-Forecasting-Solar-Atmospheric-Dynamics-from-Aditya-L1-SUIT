# Data set c0: the CENTRED pointing mode (19 Sep -> 23 Sep ~05:00 UT). Same rules as v0 (configs/phase2.toml)
# except the pointing mode and the dates. In centred mode the Level-1 disk is nearly free of the offset-mode
# vignetting gradient (PHASE3 4b), so c0 is a natural instrument control for the Phase 3 finding that model skill
# at long horizons is mostly undoing the derotation of a static background.
# Select it with the environment variable SUITDYN_DATASET=c0 (suitdyn/config.py).

[dataset]
# Centred pointing only (it ended 2026-09-23 ~05:00 UT, docs/PHASE2.md).
pointing_mode = "centred"
# QC flags that exclude a frame from the data set (a frame with other flags is kept and the flag stored).
# brightness_jump is NOT excluded: those frames are single-frame whole-disk ±1-3 % excursions; whether
# frame-level normalisation absorbs them is decided by the normalisation experiment (docs/PHASE2.md).
exclude_flags = ["pointing_mode_change", "limb_outlier", "spike_rate"]
# The first frame of every observing-program block, and of every run after a gap, is 15-19 % too
# bright (PHASE1.md A8; confirmed for gaps within a program in Phase 2).
drop_program_first_frame = true

[split]
# Cut only at natural observing gaps; every boundary falls in a gap longer than max_gap_s.
# The test split is sealed: its frame list is hashed when the split is written and reading test
# windows needs an explicit unseal (suitdyn.sequences).
train = ["2026-09-19 00:00", "2026-09-21 23:45"]
val = ["2026-09-22 00:00", "2026-09-22 14:30"]
test = ["2026-09-22 16:00", "2026-09-23 06:00"]

[sequences]
# Two consecutive frames further apart than this are in different runs; no window spans a run break.
max_gap_s = 300
# Context lengths (frames) and horizons (frames) to index; elapsed times are stored per window.
contexts = [1, 5, 20]
horizons = [1, 5, 10, 20, 40, 80, 160]
