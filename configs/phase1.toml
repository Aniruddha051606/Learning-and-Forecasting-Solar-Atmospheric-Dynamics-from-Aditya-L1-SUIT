# Phase 1 settings: manifest, audit, QC, registration. Every script reads this file; nothing is hard-coded.

[paths]
# Archive of record: the network share (read-only; forward slashes: a leading \ is mangled by shells
# and TOML). scripts/sync_archive.py mirrors new files from it into raw_root, the local working copy.
archive_root = "//192.168.1.2/DATA/pradan1.issdc.gov.in/al1/protected/downloadData/suit/level1"
raw_root = "D:/Data/pradan1.issdc.gov.in/al1/protected/downloadData/suit/level1"
out = "outputs/phase1"

[run]
workers = 6

[limb]
# Edge search window around the header radius, as a fraction of R.
window = 0.07
# Gaussian smoothing before the radial derivative, in pixels of a 2048 frame (scaled for 4096).
smooth_px = 2.0
rays = 720
# Rays whose search window comes closer than this to the CCD edge are dropped (vignetting, see DESIGN §0).
edge_margin_px = 40
# Angular harmonics fitted with the circle to absorb Level-1 distortion (0 = plain circle).
# Recorded per frame for the study; registration uses the plain circle, because on real frames the
# harmonic fit's centre is 3-4x noisier (docs/PHASE1.md, Registration).
harmonics = 4
clip_sigma = 3.0

[qc]
# Spike: residual from a 5x5 median above k robust sigma AND above this fraction of the local level.
spike_k = 10.0
spike_rel = 0.5
spike_max_area = 6
# Quadrant boundaries in 2048 (binned) pixels; doubled for 4096 frames.
seam_px = 1024
seam_halfwidth = 2
# Disk region used for intensity statistics, in units of R.
core_r = 0.9

[calibration]
# Scale below which the NB03 fixed pattern is corrected (NaN-aware Gaussian high-pass, binned px).
# A documented choice, not an automatic rule: independent pattern estimates from different days agree
# at r = 0.949 at 8 px vs 0.888 at 16 px and 0.848 at 32 px (phase2_calibration_followup.py C1);
# larger scales carry solar leakage (active regions that did not move far enough).
pattern_highpass_px = 8

[register]
# Common grid for every full-disk frame (both pipelines): disk-centred, solar north up.
grid = 1536
r_ref = 690.0
# Local-quadratic smoothing of the per-frame limb centre within jump-free segments (±10 min ≈ ±7
# frames): averages the ~1.4 px per-frame fit noise while following the ~1.5-2 h pointing oscillation.
smooth_half_window_s = 600
