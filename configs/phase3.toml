# Phase 3: learning. Read by every phase3 script through suitdyn.config.load_phase3(). Nothing about the
# learning stage is hard-coded in the scripts; changing a value here changes the pipeline fingerprint of
# every stage that reads it (suitdyn/pipeline.py), so the affected stages rerun.

[samples]
# Frames are block-averaged from the 1536 store grid by this factor (4 -> 384 x 384, 5.6"/px).
grid_factor = 4
# Context frames per sample, and forecast horizons in frames (87 s cadence: 28 min, 57 min, 1.9 h, 3.8 h).
context = 5
horizons = [20, 40, 80, 160]
# The last training run is kept out of training: early stopping and every tuned baseline use it, so the
# validation split stays a clean reporting set.
holdout = "last_train_run"
# Every window is a sample (samples are assembled on the fly from the frame cache, so there is no disk
# cost for using all of them).
train_stride = 1

[background]
# Static background S (scripts/phase3_background.py): derotation must not move what is fixed on the grid.
# Gradient-penalty values scanned on the hold-out run (fit on train pairs only), then S is refit on
# train + hold-out with the chosen value.
lambdas = [0.1, 0.3, 1.0, 3.0, 10.0, 30.0]
residual_clip = 0.25
rho_max = 0.95
# lambda is scored inside this radius: in the outer ring (0.9-0.95) S is poorly constrained (foreshortening,
# rotation sources off the disk; tests/test_ml_data_background.py), so it must not drive the choice.
score_rho_max = 0.9
# Pointing groups: the detector background moves with the pointing, so over a long data set one S smears.
# Samples are grouped by target pointing in bins of this size (2048-px units; the oscillation is +-10 px),
# bins with fewer pairs are merged into the nearest large bin, each group's S is pulled toward the common S
# with this weight, and grouping is kept only if it beats the single S on the hold-out run.
pointing_bin_px = 12.0
pointing_min_pairs = 150
pointing_shrink = 1.0

[model]
# Model zoo: suitdyn/ml/models.py. Every model predicts the residual over its B1 (plain or background-aware).
types = ["unet", "convlstm"]
unet_base = 16
convlstm_hidden = 32

[train]
inputs = "bg"             # "plain": derotate whole frames; "bg": rot(F - S) + S (background-aware B1)
seeds = [0, 1, 2]
# With epoch_fraction = 0.25 an "epoch" is a quarter of the training set: 100 epochs = 25 full passes (the
# ConvLSTM needed ~25 before) and patience 16 = 4 full passes without improvement on the hold-out run.
epochs = 100
patience = 16
# Check the hold-out run every this many epochs (always at the last one); halves its overhead.
eval_every = 2
batch = 8
lr = 3.0e-4
weight_decay = 1.0e-4
grad_clip = 1.0
bf16 = true
# Samples drawn per epoch (fraction of the training set, a new random draw every epoch). Consecutive
# windows share K-1 of their K context frames, so a full pass is mostly repetition: 0.25 trains ~4x faster
# per epoch on this thermally limited laptop (~6-10 % sustainable GPU duty) with little loss.
epoch_fraction = 0.25

[thermal]
# Duty-cycle controller (suitdyn/ml/thermal.py, class Thermal). enabled = false runs the GPU at full duty and only
# logs its temperature. Unthrottled, the GPU reached 96 C in 19 s on 2026-10-09 (scripts/thermal_benchmark.py), so
# the controller stays on. Target raised 75 -> 95 C at the user's request (2026-10-09, cooling upgraded 2026-10-08);
# the hard stop is then 98 C (pause until 90 C). The GPU slows itself at 97 C and shuts down at 100 C. Operational
# only: [thermal] is not part of any stage fingerprint (suitdyn/pipeline.py OPERATIONAL).
enabled = true
target_c = 95.0
max_c = 98.0
resume_c = 90.0

[eval]
# Regions: disk (r < 0.95), trusted (Phase 2 trusted region), plage. Plage is defined from the forecast
# side and relative to the local large-scale level, so the offset-mode vignetting does not bias it:
# pixel / Gaussian(pixel, plage_sigma_px) > plage_contrast.
plage_sigma_px = 8.0
# Every region is limited to rho < disk_rho_max: the limb ring is unreliable for every derotation-based
# forecast (foreshortening, sources off the disk, S poorly constrained), and a model must not earn skill there.
disk_rho_max = 0.9
plage_contrast = 1.25
bootstrap = 2000
# Baselines a model must beat; its skill is reported against the strongest per region and horizon.
baselines = ["B1", "B1-avg", "B1-avg-LDadd", "B1-avg-bgS", "B1-avg-clim"]

[controls]
# Negative controls (scripts/phase3_evaluate.py). A model that shows skill here has learned an artefact.
#   shuffle:  context frames from another time (same horizon, same split): skill must vanish
#   frozen:   target = the last context frame derotated to the target time plus real frame-to-frame
#             noise, i.e. a Sun with no evolution: skill over B1 must be ~0
enabled = ["shuffle", "frozen"]
samples = 400
