# Data set 'smoke': a small real-data set (~1.5 days, offset pointing) to test the whole pipeline end to end
# quickly (python -m suitdyn run --dataset smoke --smoke). Same rules as v0; its numbers are not results.

[dataset]
# Prototype data set: offset pointing only (centred pointing ended 2026-09-23 05:00 UT, docs/PHASE2.md).
pointing_mode = "offset"
# QC flags that exclude a frame from the data set (a frame with other flags is kept and the flag stored).
# brightness_jump is NOT excluded: those frames are single-frame whole-disk ±1-3 % excursions; whether
# frame-level normalisation absorbs them is decided by the normalisation experiment (docs/PHASE2.md).
exclude_flags = ["pointing_mode_change", "limb_outlier", "spike_rate"]
# The first frame of every observing-program block, and of every run after a gap, is 15-19 % too
# bright (PHASE1.md A8; confirmed for gaps within a program in Phase 2).
drop_program_first_frame = true

[scope]
# Phase 1 (registration, QC statistics) and the archive stages use only frames inside the split span widened by
# this margin: a data set never depends on frames outside it (PHASE3 4c).
margin_h = 1

[split]
# Each split starts at least this long after the previous one ends: solar structure persists for hours,
# so adjacent splits would share solar states. Longer than the longest horizon (3.8 h) plus the context.
# smoke only tests the machinery: 4 h would drop its whole 2-h test split, so the embargo is shorter here
embargo_h = 1.0
# Train: programs 151 (23 Sep evening), 147 and 139 (24 Sep); the last run (139) becomes the hold-out.
train = ["2026-09-23 16:00", "2026-09-24 14:30"]
val = ["2026-09-24 16:00", "2026-09-24 23:45"]
test = ["2026-09-25 00:00", "2026-09-25 02:45"]

[sequences]
max_gap_s = 300
contexts = [1, 5, 20]
horizons = [1, 5, 10, 20, 40, 80, 160]
